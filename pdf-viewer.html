<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>عارض الـ PDF الاحترافي - Ahmed Mousa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background-color:#0d1117;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.viewer-header{position:fixed;top:0;left:0;width:100%;height:60px;background:rgba(13,17,23,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:1000}
.header-title{font-size:14px;font-weight:600;color:#e6edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.header-actions{display:flex;gap:10px;align-items:center}.action-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}.action-btn:active{background:rgba(255,255,255,.25);transform:scale(.95)}
.upload-container{margin-top:60px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center}.upload-card{background:#161b22;border:2px dashed rgba(255,255,255,.15);padding:40px 20px;border-radius:16px;width:100%;max-width:400px;cursor:pointer}.upload-card input{display:none}
#pdf-images-container{margin-top:60px;width:100%;flex:1;overflow-y:auto;overflow-x:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column;align-items:center;padding:15px 10px;gap:15px;touch-action:pan-x pan-y;transform-origin:center center;will-change:transform}.pdf-page-img{width:100%;max-width:750px;height:auto;display:block;border-radius:4px;box-shadow:0 4px 15px rgba(0,0,0,.5);background:#fff}#pdf-images-container.zooming{touch-action:none}
#loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(13,17,23,.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:2000;color:#fff;gap:12px}.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.1);border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="viewer-header"><div class="header-title" id="file-name-display">عارض المستندات المباشر</div><div class="header-actions"><button class="action-btn" id="open-external-btn" title="فتح في تطبيق آخر" onclick="openExternalApp()">📱</button><button class="action-btn" onclick="closeViewer()" title="إغلاق الملف">❌</button></div></div>
<div id="loading-overlay"><div class="spinner"></div><span id="loading-text">جاري معالجة الصفحات وعرضها بدقة...</span></div>
<div class="upload-container" id="upload-section"><label class="upload-card"><div style="font-size:40px;margin-bottom:12px">📑</div><div style="font-size:16px;font-weight:600;margin-bottom:6px;color:#e6edf3">ارفع ملف الـ PDF للعرض المباشر</div><div style="font-size:13px;color:#8b949e">يمنع تداخل الحروف ويعرض الصفحات تحت بعضها</div><input type="file" id="pdf-file-input" accept="application/pdf" onchange="handleFileSelect(event)"></label></div>
<div id="pdf-images-container"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let currentPdfBlobUrl=null;
function handleFileSelect(event){const file=event.target.files[0];if(!file)return;document.getElementById('file-name-display').innerText=file.name;currentPdfBlobUrl=URL.createObjectURL(file);const reader=new FileReader();reader.onload=e=>renderPdfAsImages(e.target.result);reader.readAsArrayBuffer(file)}
async function renderPdfAsImages(dataArrayBuffer){showLoading(true,'جاري تحضير الصفحات...');try{const loadingTask=pdfjsLib.getDocument({data:dataArrayBuffer});const pdfDoc=await loadingTask.promise;document.getElementById('upload-section').style.display='none';const container=document.getElementById('pdf-images-container');container.style.display='flex';container.innerHTML='';for(let pageNum=1;pageNum<=pdfDoc.numPages;pageNum++){const page=await pdfDoc.getPage(pageNum);const viewport=page.getViewport({scale:2.5});const canvas=document.createElement('canvas');const context=canvas.getContext('2d');canvas.height=viewport.height;canvas.width=viewport.width;await page.render({canvasContext:context,viewport}).promise;const img=document.createElement('img');img.className='pdf-page-img';img.src=canvas.toDataURL('image/png');container.appendChild(img)}}catch(error){alert('حدث خطأ أثناء معالجة الملف: '+error.message)}finally{showLoading(false)}}
function openExternalApp(){if(!currentPdfBlobUrl){alert('الرجاء اختيار ملف PDF أولاً.');return}const a=document.createElement('a');a.href=currentPdfBlobUrl;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();document.body.removeChild(a)}
function closeViewer(){if(window.history.length>1){window.history.back();return}document.getElementById('pdf-images-container').style.display='none';document.getElementById('upload-section').style.display='flex';document.getElementById('pdf-images-container').innerHTML='';document.getElementById('file-name-display').innerText='عارض المستندات المباشر';currentPdfBlobUrl=null}
(function installPinchZoom(){const container=document.getElementById('pdf-images-container');let startDistance=0,startScale=1,scale=1,startCenterX=0,startCenterY=0,startOffsetX=0,startOffsetY=0,offsetX=0,offsetY=0;function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}function mid(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}function apply(){container.style.transform=`translate3d(${offsetX}px,${offsetY}px,0) scale(${scale})`}container.addEventListener('touchstart',e=>{if(e.touches.length!==2)return;const a=e.touches[0],b=e.touches[1];startDistance=dist(a,b);startScale=scale;const c=mid(a,b);startCenterX=c.x;startCenterY=c.y;startOffsetX=offsetX;startOffsetY=offsetY;container.classList.add('zooming')},{passive:false});container.addEventListener('touchmove',e=>{if(e.touches.length!==2||!startDistance)return;e.preventDefault();const a=e.touches[0],b=e.touches[1],d=dist(a,b);scale=Math.max(1,Math.min(4,startScale*d/startDistance));const c=mid(a,b);offsetX=startOffsetX+c.x-startCenterX;offsetY=startOffsetY+c.y-startCenterY;apply()},{passive:false});container.addEventListener('touchend',e=>{if(e.touches.length<2){startDistance=0;container.classList.remove('zooming')}},{passive:true})})();
function showLoading(show,text=''){const overlay=document.getElementById('loading-overlay');const txt=document.getElementById('loading-text');if(show){txt.innerText=text;overlay.style.display='flex'}else overlay.style.display='none'}
(async function(){const q=new URLSearchParams(location.search);const url=q.get('url');const name=q.get('name')||'ملف PDF';if(!url)return;document.getElementById('file-name-display').innerText=name;document.getElementById('upload-section').style.display='none';currentPdfBlobUrl=url;try{showLoading(true,'جاري تحضير الصفحات...');const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('تعذر تحميل ملف PDF');const data=await res.arrayBuffer();await renderPdfAsImages(data)}catch(e){showLoading(false);alert(e.message||'تعذر فتح ملف PDF')}})();
</script></body></html>
