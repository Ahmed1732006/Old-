<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحميل الملف</title><style>body{margin:0;min-height:100vh;background:#0d1117;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center}.box{text-align:center;padding:28px}.icon{font-size:58px;margin-bottom:16px}.name{font-size:16px;color:#e6edf3;margin-bottom:22px;max-width:85vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{border:0;border-radius:12px;padding:13px 24px;background:#238636;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.close{display:block;margin:16px auto 0;background:transparent;color:#9da7b3;border:1px solid #30363d}</style></head><body><main class="box"><div class="icon">📥</div><div class="name" id="name">الملف غير قابل للعرض داخل الموقع</div><button class="btn" id="download">تحميل</button><button class="btn close" onclick="history.back()">❌ رجوع</button></main><script>const q=new URLSearchParams(location.search),url=q.get('url'),name=q.get('name')||'الملف';document.getElementById('name').textContent=name;document.getElementById('download').onclick=async()=>{if(!url)return;const b=document.getElementById('download');const old=b.textContent;b.textContent='جاري التجهيز…';try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error();const blob=await r.blob();const objectUrl=URL.createObjectURL(blob);const a=document.createElement('a');a.href=objectUrl;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),2000)}catch(e){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.download=name;document.body.appendChild(a);a.click();a.remove()}finally{b.textContent=old}};</script></body></html>
