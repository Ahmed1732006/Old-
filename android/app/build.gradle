plugins { id 'com.android.application' }

android {
    namespace 'com.inthevoid.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.inthevoid.app'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Generate Android resources from the existing repository files before resource processing.
    def webSource = file('../../app')
    def iconSource = file('../../1.png')
    def generatedRes = file("$buildDir/generated/in-the-void/res")
    def webTarget = file('src/main/assets')
    def iconTarget = file("$generatedRes/drawable-nodpi/app_icon.png")

    sourceSets {
        main.res.srcDir generatedRes
    }

    tasks.register('prepareWebAssets') {
        inputs.dir(webSource)
        inputs.file(iconSource)
        outputs.dir(webTarget)
        outputs.file(iconTarget)
        doLast {
            delete webTarget
            copy { from webSource; into webTarget }
            delete generatedRes
            iconTarget.parentFile.mkdirs()
            copy { from iconSource; into iconTarget }
        }
    }

    preBuild.dependsOn tasks.named('prepareWebAssets')
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}

// Keep Kotlin's JDK extension modules aligned to avoid duplicate-class errors
// introduced by transitive AndroidX dependencies.
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
