plugins { id 'com.android.application' }

android {
    namespace 'com.inthevoid.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.inthevoid.app'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Copy the existing website from the repository root /app into Android assets.
    def webSource = file('../../app')
    def webTarget = file('src/main/assets')

    tasks.register('prepareWebAssets') {
        inputs.dir(webSource)
        outputs.dir(webTarget)
        doLast {
            delete webTarget
            copy { from webSource; into webTarget }
        }
    }

    preBuild.dependsOn tasks.named('prepareWebAssets')
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}

// AndroidX can bring old Kotlin JDK extension modules transitively.
// Exclude them because kotlin-stdlib already contains these classes.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
